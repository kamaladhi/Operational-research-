name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      # The fast suite: unit, model-fingerprint, UI and live solves of Instances 1-2.
      # The slow live solves of Instances 3-4 (RUN_SLOW_TESTS=1) take about 8 minutes and are run locally.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
